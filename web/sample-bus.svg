<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Sample city bus information board</title>
  <desc id="desc">A practice sign listing Bus 24, Central Station, and Platform B.</desc>
  <rect width="900" height="540" rx="24" fill="#e3e9dc"/>
  <rect x="58" y="55" width="784" height="430" rx="24" fill="#f9f7e9" stroke="#153f37" stroke-width="12"/>
  <path d="M58 90q0-35 35-35h714q35 0 35 35v75H58z" fill="#153f37"/>
  <text x="450" y="135" fill="#d8efa0" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" letter-spacing="4">CITY BUS INFORMATION</text>
  <text x="115" y="250" fill="#153f37" font-family="Arial,sans-serif" font-size="76" font-weight="700">24</text>
  <path d="M250 223h58m-18-18 18 18-18 18" fill="none" stroke="#458268" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="353" y="245" fill="#153f37" font-family="Arial,sans-serif" font-size="48" font-weight="700">CENTRAL STATION</text>
  <path d="M108 292h684" stroke="#b5c1b0" stroke-width="4"/>
  <text x="113" y="373" fill="#52675d" font-family="Arial,sans-serif" font-size="32" font-weight="600">BOARDING AREA</text>
  <rect x="548" y="326" width="190" height="85" rx="16" fill="#d5edaa"/>
  <text x="643" y="382" fill="#153f37" font-family="Arial,sans-serif" font-size="39" font-weight="700" text-anchor="middle">PLATFORM B</text>
  <text x="450" y="449" fill="#77867b" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">PRACTICE SIGN · NO LIVE SERVICE INFORMATION</text>
</svg>
